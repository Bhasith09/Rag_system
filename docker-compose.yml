version: "3.9"

services:

  backend:
    build:
      context: .
      dockerfile: dockerfile.fastapi

    ports:
      - "8001:8000"

    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: dockerfile.streamlit

    ports:
      - "8502:8501"
    env_file:
      - .env

    depends_on:
      - backend